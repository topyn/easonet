  <path d="M400 220 L520 420 L280 420 Z" fill="none" stroke="#2563eb" stroke-width="32" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="310" y1="370" x2="490" y2="370" stroke="#2563eb" stroke-width="32" stroke-linecap="round"/>
  <!-- chain links -->
  <circle cx="370" cy="370" r="18" fill="none" stroke="#001b33" stroke-width="6"/>
  <circle cx="430" cy="370" r="18" fill="none" stroke="#001b33" stroke-width="6"/>
  <text x="400" y="510" font-family="'Arial Black', sans-serif" font-weight="900" font-size="64" fill="#ffffff" text-anchor="middle" letter-spacing="-2">ahrefs</text>
  <rect x="280" y="542" width="240" height="36" rx="18" fill="#2563eb" opacity="0.15"/>
  <text x="400" y="566" font-family="Arial, sans-serif" font-weight="500" font-size="16" fill="#2563eb" text-anchor="middle" letter-spacing="1">SEO &amp; BACKLINKS</text>
